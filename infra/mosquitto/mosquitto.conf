# Basic Mosquitto config for development.
# Anonymous access is disabled — a password file must be generated
# before first use (see README "MQTT setup" section). Never commit
# the generated passwd file with real credentials.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
